name: CI/CD (GitHub)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: dockhand.example.com
  IMAGE_NAME: synccal

jobs:
  # ============================================================
  # Lint & Test
  # ============================================================
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run linter (binaire officiel — sans runtime Node)
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v1.64.8
          golangci-lint run ./...

      - name: Run unit tests (coverage)
        run: go test -v -race -coverprofile=coverage.out ./internal/...

      - name: Run integration tests (skipped without Docker)
        run: go test -v ./tests/integration/...

      - name: Enforce coverage >= 90% (internal packages)
        run: |
          # Objectif défini sur internal/... (cmd et tests d'intégration exclus)
          go test -coverprofile=coverage-internal.out -covermode=atomic ./internal/...
          COV=$(go tool cover -func=coverage-internal.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Internal coverage: ${COV}%"
          awk "BEGIN {exit !($COV >= 90)}" || { echo "::error::Coverage ${COV}% < 90%"; exit 1; }

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()

  # ============================================================
  # Auto Version Bump (GitHub ONLY - on push to main)
  # ============================================================
  version-bump:
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'lamacheref/synccal'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version
        id: bump
        run: |
          python3 scripts/bump_version.py

      - name: Create & push tag to GitHub
        if: steps.bump.outputs.version != '0.0.0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.bump.outputs.tag }}
          git push github ${{ steps.bump.outputs.tag }}

  # ============================================================
  # Build & Push Docker Image
  # ============================================================
  docker:
    needs: [lint-test, version-bump]
    if: github.event_name == 'push' && github.repository == 'lamacheref/synccal'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to dockhand
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKHAND_USERNAME }}
          password: ${{ secrets.DOCKHAND_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Release (on tag push) - GitHub only
  # ============================================================
  release:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'lamacheref/synccal'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD > CHANGELOG_RELEASE.md
          else
            git log --pretty=format:"- %s (%h)" > CHANGELOG_RELEASE.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false