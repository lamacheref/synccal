# Woodpecker CI for Gitea
# Place at .woodpecker.yml in repo root

pipeline:
  # Lint & Test
  lint-test:
    image: golang:1.23-alpine
    commands:
      - apk add --no-cache git make
      - go mod download
      - golangci-lint run ./...
      - go test -v -race -coverprofile=coverage.out ./...
      - |
        COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
        echo "Coverage: $COV%"
        # seuil sur internal (le module complet inclut tests d'intégration skippés)
        ICOV=$(go test -coverprofile=/tmp/cov-int.out ./internal/... >/dev/null; go tool cover -func=/tmp/cov-int.out | grep total | awk '{print $3}' | tr -d '%')
        echo "Internal coverage: $ICOV%"
        apk add --no-cache gawk >/dev/null || true
        awk "BEGIN {exit !($ICOV >= 90)}" || { echo "Internal coverage $ICOV% < 90%"; exit 1; }
    when:
      event: [push, pull_request]
      branch: main

  # Build & Push Docker Image (Gitea - NO version bump)
  docker:
    image: docker.io/plugins/docker:latest
    settings:
      registry: dockhand.example.com
      username:
        from_secret: DOCKHAND_USERNAME
      password:
        from_secret: DOCKHAND_PASSWORD
      repo: dockhand.example.com/synccal
      tags:
        - latest
        - main
        - ${DRONE_COMMIT_SHA:0:8}
      platforms: linux/amd64,linux/arm64
      build_args:
        - VERSION=${DRONE_COMMIT_SHA:0:8}
    when:
      event: push
      branch: main

# No version-bump job on Gitea - tags only created from GitHub
# No release job on Gitea - releases only on GitHub