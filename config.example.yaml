# SyncCal Configuration Example
# Copy to config.yaml and adjust

# Sources: each source has a unique name (referenced by destinations)
# Plugin types: "caldav" (default, public .ics ou CalDAV auth) ou "ics" (alias public)
sources:
  - name: "feries-fr"
    type: "caldav"
    url: "https://example.com/calendar.ics"
    # username: ""  # Optional - if provided, uses CalDAV auth
    # password: ""  # Optional - token or app password
    # transformers: [] # optional, ex:
    #   - type: "filter-category"
    #     options:
    #       categories: "work, perso"

  # Authenticated source example:
  # - name: "source-carbonio"
  #   type: "caldav"
  #   url: "https://cloud.example.com/remote.php/dav/calendars/user/source/"
  #   username: "user"
  #   password: "app-password-or-token"
  #   transformers:
  #     - type: "prefix-summary"
  #       options:
  #         prefix: "[Carbonio] "

# Destinations: each destination is paired to a source via `source` (name)
# Plugin types: "caldav" (Nextcloud, Carbonio)
destinations:
  - name: "nextcloud-personal"
    type: "caldav"
    url: "https://cloud.example.com/remote.php/dav/calendars/user/personal/"
    username: "user"
    password: "app-password-or-token"
    source: "feries-fr"
    # transformers: pipeline appliqué après fetch, avant PUT
    # Le préfixe UID (hash source) et le filtre PRIVATE sont automatiques,
    # mais peuvent être surchargés :
    # transformers:
    #   - type: "mask-private"
    #     options:
    #       summary: "Busy"
    #   - type: "filter-category"
    #     options:
    #       categories: "work"
    #   - type: "prefix-summary"
    #     options:
    #       prefix: "[Sync] "

  # - name: "carbonio-work"
  #   type: "caldav"
  #   url: "https://mail.example.com/dav/calendars/user/work/"
  #   username: "user@domain.com"
  #   password: "app-password"
  #   source: "source-carbonio"

# Database for UID mapping and state
database:
  path: "./data/synccal.db"

# Sync configuration
sync:
  interval: "1h"           # Duration: 30m, 1h, 2h, etc.
  # interval: "0"          # Disable scheduler (run once)
  timeout: "5m"            # Max duration per sync run
  batch_size: 100          # Events per batch
  delete_mode: "soft"      # "soft" (mark deleted) | "hard" (purge)
  filter_private: true     # legacy : exclut les événements PRIVATE/CONFIDENTIAL (transformer filter-private automatique)

# Metrics & health
metrics:
  addr: ":8080"

# Web interface & REST API
web:
  addr: ":8080"        # Listen address (defaults to metrics.addr if empty)
  token: ""            # Access token for the UI/API ("" = open, set a token to protect)

# Logging
logging:
  level: "info"           # debug, info, warn, error
  format: "json"          # json, console
