# Production : SyncCal via Docker Compose
#
#   cp /etc/synccal/config.yaml ./config.yaml   # configuration à côté du compose
#   docker compose -f docker-compose.prod.yml up -d
#
# Mise à jour :
#   docker compose -f docker-compose.prod.yml pull && \
#   docker compose -f docker-compose.prod.yml up -d

services:
  synccal:
    image: gitea.smiden.eu/flamachere/synccal:latest
    container_name: synccal
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # exposer derrière un reverse proxy (TLS)
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - synccal-data:/app/data
      - synccal-plugins:/app/data/plugins
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  synccal-data:
  synccal-plugins:
