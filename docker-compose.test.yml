version: '3.8'

services:
  nextcloud-source:
    image: nextcloud:28-apache
    environment:
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - nextcloud-source-data:/var/www/html

  nextcloud-dest:
    image: nextcloud:28-apache
    environment:
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - nextcloud-dest-data:/var/www/html

  public-ics:
    image: nginx:alpine
    ports:
      - "8083:80"
    volumes:
      - ./testdata/calendar.ics:/usr/share/nginx/html/calendar.ics:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/calendar.ics"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  nextcloud-source-data:
  nextcloud-dest-data: