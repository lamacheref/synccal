<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SyncCal</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="app-bar">
    <div class="app-bar-inner">
      <div class="brand">
        <span class="brand-logo">&#128197;</span>
        <div>
          <h1>SyncCal</h1>
          <span class="brand-sub">Synchroniseur de calendriers</span>
        </div>
      </div>
      <div class="app-bar-actions">
        <span id="run-indicator" class="run-badge hidden">Sync en cours&#8230;</span>
        <button id="btn-sync" class="btn btn-primary">Synchroniser maintenant</button>
        <button id="btn-logout" class="btn btn-outline hidden">Déconnexion</button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="dashboard">Dashboard</button>
    <button class="tab" data-tab="config">Configuration</button>
    <button class="tab" data-tab="events">Événements</button>
    <button class="tab" data-tab="logs">Logs</button>
  </nav>

  <main id="content">
    <section id="view-dashboard" class="view active"></section>
    <section id="view-config" class="view"></section>
    <section id="view-events" class="view"></section>
    <section id="view-logs" class="view"></section>
  </main>

  <div id="snackbar" class="snackbar"></div>

  <div id="login-screen" class="overlay">
    <div class="login-card card">
      <h2>Authentification requise</h2>
      <p class="login-hint">Entrez le token d'accès configuré dans la section <code>web</code> du fichier de configuration.</p>
      <div id="login-message" class="login-error hidden"></div>
      <div class="field">
        <label for="login-token">Token d'accès</label>
        <input id="login-token" type="password" autocomplete="current-password">
      </div>
      <button id="btn-login" class="btn btn-primary">Se connecter</button>
    </div>
  </div>

  <!-- Confirmation modal -->
  <div id="confirm-modal" class="overlay hidden">
    <div class="confirm-card">
      <h3 id="confirm-title">Confirmer</h3>
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="btn btn-outline">Annuler</button>
        <button id="confirm-ok" class="btn btn-danger">Confirmer</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
